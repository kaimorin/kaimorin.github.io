<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
   <link rel="icon" type="image/x-icon" href="src/assets/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaimorin · Ingeniería en Informática</title>
    <meta
      name="description"
      content="Portafolio de Kaimorin, estudiante de Ingeniería en Informática (Desarrollo de Software) en Duoc UC."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar parpadeos.
      (function () {
        try {
          var tema = localStorage.getItem('tema')
          if (tema !== 'light' && tema !== 'dark') {
            tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = tema
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
